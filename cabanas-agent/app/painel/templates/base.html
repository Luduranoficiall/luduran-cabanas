<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Painel interno com dado pessoal: fora de buscador. -->
<meta name="robots" content="noindex, nofollow">
<title>{% block titulo %}Painel{% endblock %} · Luduran IA</title>
<style>
  :root{
    --bg-0:#080b10; --bg-1:#0d131b; --amber:#e3a545;
    --text-hi:#eef1f3; --text-lo:#8696a0; --line:#1c2530;
    --ok:#4ea87a; --alerta:#c9803f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg-0); color:var(--text-hi);
    font-family:'Inter',-apple-system,system-ui,sans-serif;
    min-height:100vh; font-size:14px; line-height:1.5;
  }
  a{ color:var(--amber); }
  .topo{
    border-bottom:1px solid var(--line); background:var(--bg-1);
    padding:14px 20px; display:flex; align-items:center;
    gap:16px; flex-wrap:wrap;
  }
  .marca{ font-weight:700; letter-spacing:.02em; }
  .marca span{ color:var(--amber); }
  .topo nav{ display:flex; gap:14px; margin-left:8px; }
  .topo nav a{ text-decoration:none; color:var(--text-lo); }
  .topo nav a:hover, .topo nav a.ativo{ color:var(--text-hi); }
  .topo-dir{ margin-left:auto; display:flex; align-items:center; gap:12px; color:var(--text-lo); font-size:12.5px; }
  .sair{ background:none; border:1px solid var(--line); color:var(--text-lo);
    padding:5px 12px; border-radius:16px; cursor:pointer; font-size:12px; }
  .sair:hover{ border-color:var(--amber); color:var(--amber); }
  main{ max-width:980px; margin:0 auto; padding:26px 20px 60px; }
  h1{ font-size:20px; font-weight:700; margin-bottom:4px; }
  .legenda{ color:var(--text-lo); font-size:13px; margin-bottom:22px; }
  .filtros{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:24px; }
  .filtros label{ display:block; font-size:11px; color:var(--text-lo);
    text-transform:uppercase; letter-spacing:.08em; margin-bottom:5px; }
  select,input[type=number]{
    background:var(--bg-1); color:var(--text-hi);
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px;
  }
  .btn{
    background:var(--amber); color:#1a1206; border:none; border-radius:8px;
    padding:9px 16px; font-weight:600; font-size:13px; cursor:pointer;
    text-decoration:none; display:inline-block;
  }
  .btn-sec{ background:none; border:1px solid var(--line); color:var(--text-hi); }
  .btn-sec:hover{ border-color:var(--amber); }
  :focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  .rolagem{ overflow-x:auto; border:1px solid var(--line); border-radius:12px; }
  th,td{ padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
  th{ font-size:11px; text-transform:uppercase; letter-spacing:.07em;
    color:var(--text-lo); font-weight:600; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:rgba(255,255,255,.02); }
  .num{ font-variant-numeric:tabular-nums; }
  .vazio{ padding:34px; text-align:center; color:var(--text-lo); }
  .aviso{
    border:1px solid rgba(227,165,69,.3); background:rgba(227,165,69,.06);
    color:var(--text-lo); border-radius:10px; padding:12px 14px;
    font-size:12.5px; margin-bottom:20px;
  }
  .tag{ font-size:11px; padding:2px 8px; border-radius:10px;
    border:1px solid var(--line); color:var(--text-lo); }
  .tag-quente{ border-color:rgba(227,165,69,.45); color:var(--amber); }
</style>
</head>
<body>
{% if usuario %}
<header class="topo">
  <div class="marca">LUDURAN <span>IA</span></div>
  <nav>
    <a href="/painel/?nicho={{ nicho }}" class="{{ 'ativo' if pagina == 'painel' }}">Visão do mês</a>
    <a href="/painel/fechamento?nicho={{ nicho }}" class="{{ 'ativo' if pagina == 'fechamento' }}">Fechamento</a>
    <a href="/painel/escalacoes?nicho={{ nicho }}" class="{{ 'ativo' if pagina == 'escalacoes' }}">Escalações</a>
    {% if usuario.eh_admin %}
    <a href="/painel/auditoria" class="{{ 'ativo' if pagina == 'auditoria' }}">Auditoria</a>
    {% endif %}
  </nav>
  <div class="topo-dir">
    <span>{{ usuario.email }}{% if usuario.eh_admin %} · admin{% else %} · leitura{% endif %}</span>
    <form method="post" action="/painel/logout"><button class="sair">Sair</button></form>
  </div>
</header>
{% endif %}
<main>
{% block conteudo %}{% endblock %}
</main>
</body>
</html>
